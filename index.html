<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Racing METU</title>
<meta name="description" content="Apex Racing — Formula Student team at METU NCC. Designing, building and racing a formula vehicle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Bebas+Neue&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="assets/apex-logo.png">
<meta property="og:title" content="Apex Racing METU">
<meta property="og:description" content="Formula Student team at METU Northern Cyprus Campus.">
<meta property="og:image" content="assets/racing-wide.jpg">
</head>
<body>
<!-- =============================================================
     MARKA İŞARETİ + İKON DEPOSU
     <symbol> ler görünmez; <use href="#..."> ile çağrılır.
     Aynı işareti header, footer ve hero'da tekrar yazmıyoruz.
     ============================================================= -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">

  <symbol id="ic-mail" viewBox="0 0 24 24">
    <rect x="2.5" y="5" width="19" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M3 7l9 6 9-6" fill="none" stroke="currentColor" stroke-width="1.8"/>
  </symbol>
  <symbol id="ic-pin" viewBox="0 0 24 24">
    <path d="M12 21s7-6.3 7-11a7 7 0 10-14 0c0 4.7 7 11 7 11z" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="12" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
  </symbol>
  <symbol id="ic-ig" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/>
  </symbol>
  <symbol id="ic-li" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M7.5 10v7M7.5 7.2v.1M11.5 17v-4a2.5 2.5 0 015 0v4" fill="none"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
</svg>


<!-- =============================================================
     ÜST BAR
     ============================================================= -->
<header class="topbar">
  <div class="shell topbar-inner">

    <a class="brand" href="#/" aria-label="Apex Racing METU — home">
      <img class="brand-logo" src="assets/apex-logo.png" alt="Apex Racing METU">
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-type"><em>METU NCC<br>Formula Student</em></span>
    </a>

    <button class="burger" id="burger" aria-expanded="false" aria-controls="nav">
      <span aria-hidden="true"></span>
      <span class="sr-only">Menu</span>
    </button>

    <nav class="nav" id="nav" aria-label="Main"></nav>

    <div class="lang" id="lang" role="group" aria-label="Language"></div>

  </div>
  <!-- İnce bordo çizgi: sayfanın omurgası, her bölümde devam ediyor -->
  <div class="topbar-rule" aria-hidden="true"><i id="scrollFill"></i></div>
</header>


<main id="view" tabindex="-1"></main>


<footer class="footer">
  <div class="shell footer-inner">
    <div class="footer-brand">
      <img class="brand-logo brand-logo--lg" src="assets/apex-logo.png" alt="Apex Racing METU">
      <div><p id="footTag"></p></div>
    </div>
    <nav class="footer-nav" id="footNav" aria-label="Footer"></nav>
    <div class="footer-social" id="footSocial"></div>
    <p class="footer-legal" id="footLegal"></p>
  </div>
</footer>

<script src="js/content.js"></script>
<script src="js/track.js"></script>
<script src="js/sim.js"></script>
<script src="js/app.js"></script>
</body>
</html>
